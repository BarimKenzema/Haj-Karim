# FILE: .github/workflows/runner.yml (for your FIRST repo: v2ray-collector)
# FINAL VERSION WITH SECRET PASSING

name: Run V2Ray Collector (Linux)

on:
  schedule:
    - cron: '*/99 * * * *' # Your original schedule
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Run Python script
        # --- THIS IS THE CRITICAL FIX ---
        # The 'env' block takes the secret from GitHub's vault
        # and makes it available as an environment variable to the script.
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
        run: python main.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "✅ Automated Config Update (Linux)"
