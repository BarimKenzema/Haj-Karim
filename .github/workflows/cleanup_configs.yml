name: Cleanup Duplicate Configs

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours
  workflow_dispatch:  # Allows manual trigger from Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run cleanup script
        run: python cleanup.py
        env:
          CONFIG_FILE: 'hugs.txt'
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add hugs.txt
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "✅ No duplicates found. File is already clean!"
          else
            git commit -m "🧹 Auto-cleanup: Remove duplicate configs [$(date +'%Y-%m-%d %H:%M:%S')]"
            git push
            echo "✅ Successfully removed duplicates and pushed changes!"
          fi
