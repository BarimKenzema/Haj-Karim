name: Run V2Ray Collector

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run collector script
        env:
          COLLECTOR_TOKEN: ${{ secrets.COLLECTOR_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python -u main.py
        continue-on-error: false

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit and push changes
        run: |
          # Fetch latest remote state
          git fetch origin main
          
          # Reset to match remote (discards local history divergence)
          git reset --soft origin/main
          
          # Stage all changes from the script
          git add -A
          
          # Check if there are actually changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          # Commit with timestamp
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "✅ Automated Update ${TIMESTAMP}"
          
          # Push with retry logic (3 attempts)
          for attempt in {1..3}; do
            echo "Push attempt ${attempt}/3..."
            
            if git push origin main --force-with-lease; then
              echo "✅ Push successful!"
              exit 0
            else
              echo "⚠️ Push failed, waiting 10 seconds..."
              sleep 10
              
              # Re-sync before retry
              git fetch origin main
              git rebase origin/main || {
                echo "Rebase failed, resetting..."
                git rebase --abort
                git reset --soft origin/main
                git add -A
                git commit -m "✅ Automated Update ${TIMESTAMP} [retry ${attempt}]"
              }
            fi
          done
          
          echo "❌ Failed to push after 3 attempts"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            *.log
            *.txt
          retention-days: 7
