name: Find Specific Configs

on:
  workflow_dispatch:
    inputs:
      search_sni:
        description: 'SNI to search for (e.g., www.icloud.com)'
        required: false
        default: 'www.icloud.com'
      search_security:
        description: 'Security type (reality, tls, or leave blank for any)'
        required: false
        default: ''
      search_flow:
        description: 'Flow type (e.g., xtls-rprx-vision or leave blank)'
        required: false
        default: ''
      search_port:
        description: 'Port number (or leave blank for any)'
        required: false
        default: ''
      search_protocol:
        description: 'Protocol (vless, vmess, trojan, or leave blank)'
        required: false
        default: ''
      search_network:
        description: 'Network type (tcp, ws, grpc, or leave blank)'
        required: false
        default: ''
      max_results:
        description: 'Maximum number of results (0 = unlimited)'
        required: false
        default: '100'

jobs:
  find-configs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run config finder
        env:
          SEARCH_SNI: ${{ github.event.inputs.search_sni }}
          SEARCH_SECURITY: ${{ github.event.inputs.search_security }}
          SEARCH_FLOW: ${{ github.event.inputs.search_flow }}
          SEARCH_PORT: ${{ github.event.inputs.search_port }}
          SEARCH_PROTOCOL: ${{ github.event.inputs.search_protocol }}
          SEARCH_NETWORK: ${{ github.event.inputs.search_network }}
          MAX_RESULTS: ${{ github.event.inputs.max_results }}
        run: |
          python scripts/config_finder.py
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: found-configs-${{ github.run_number }}
          path: |
            found_configs.txt
            found_configs_plain.txt
            search_summary.txt
          retention-days: 30
      
      - name: Display summary
        run: |
          echo "==============================================="
          echo "SEARCH SUMMARY"
          echo "==============================================="
          cat search_summary.txt
          echo ""
          echo "==============================================="
          echo "Download the artifacts above to get full results"
          echo "==============================================="
